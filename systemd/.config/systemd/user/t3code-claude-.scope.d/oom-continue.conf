# T3 Code runs each Claude thread in a transient user scope named
# t3code-claude-<id>.scope. systemd's default for a scope is OOMPolicy=stop: when the
# kernel OOM-kills one child (a test runner, a PowerShell process), systemd then stops the
# whole scope, and the foreman and every lane in that thread fail with it. `continue`
# leaves the other processes running while the kernel still kills the process that used
# the memory.
#
# systemd applies a drop-in in a `<prefix>-.scope.d` directory to every scope with that
# prefix (the same mechanism as tmux-spawn-.scope.d/memory-cap.conf, which
# setup_tmux_persistence writes). T3 sets OOMPolicy=stop explicitly on the transient
# scope, and this drop-in still wins: a scope started with `-p OOMPolicy=stop` reports
# OOMPolicy=continue while this file is present. The file is inert on a box without T3.
# It applies to scopes created after the next `systemctl --user daemon-reload`; running
# threads keep the policy they started with.
[Scope]
OOMPolicy=continue
