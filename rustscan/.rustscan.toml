# RustScan 2.1.1 Config

# Performance settings
batch_size = 10000
timeout = 1500
tries = 2
adaptive = true
verbosity = 2

# Port range (Inline table format)
range = { start = 1, end = 65535 }

# Scan order (Capitalized)
scan_order = "Random"

# Nmap handoff (MUST be an array of separate strings)
command = ["-A"]