# Set True Color
set-option -sa terminal-overrides ",xtern*:Tc"

# Mouse on
set -g mouse on

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Refresh TMUX
bind r source-file ~/.tmux.conf

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Unbind existing key bindings for Alt+Arrow keys
unbind -n M-Left
unbind -n M-Right
unbind -n M-Up
unbind -n M-Down

# Unbind existing key bindings for Ctrl+Arrow keys
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down

# Unbind existing key bindings for Home, End, Page Up, and Page Down
unbind -n Home
unbind -n End
unbind -n PageUp
unbind -n PageDown

# Unbind existing key bindings for Ctrl+Shift+Arrow keys
unbind -n C-S-Left
unbind -n C-S-Right
unbind -n C-S-Up
unbind -n C-S-Down

# Bind Ctrl+Shift+Arrow keys to resize panes
bind -n C-S-Left  resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up    resize-pane -U 5
bind -n C-S-Down  resize-pane -D 5

# Use Ctrl+Arrow keys to switch between panes
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# Bind Home and End keys to split panes horizontally
bind -n Home split-window -h -c "#{pane_current_path}"
bind -n End  split-window -h -c "#{pane_current_path}"

# Bind Page Up and Page Down keys to split panes vertically
bind -n PageUp   split-window -v -c "#{pane_current_path}"
bind -n PageDown split-window -v -c "#{pane_current_path}"

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Set Status Bar to Top
set -g status-position top

#########################################################
#########################################################

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Theme + Settings 
set -g @plugin 'dracula/tmux' # Main Theme

# Plugin Settings. The order that you define the plugins will be the order on the status bar left to right.
# Available plugins: 
# battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, playerctl, kubernetes-context, synchronize-panes
set -g @dracula-plugins "network-bandwidth cpu-usage battery"

# Switch the left smiley icon
# it can accept `hostname` (full hostname), `session`, `shortname` (short name), `smiley`, `window`, or any character.
set -g @dracula-show-left-icon session
set -g @dracula-show-empty-plugins false # Hide Empty Plugins

# time options
set -g @dracula-show-timezone false # Disable timezone
set -g @dracula-time-format "%m.%d %I:%M %p" # Set custom time format
    # %a - Abbreviated weekday name (e.g., Sun, Mon)
    # %A - Full weekday name (e.g., Sunday, Monday)
    # %b - Abbreviated month name (e.g., Jan, Feb)
    # %B - Full month name (e.g., January, February)
    # %d - Day of the month (01 to 31)
    # %H - Hour in 24-hour format (00 to 23)
    # %I - Hour in 12-hour format (01 to 12)
    # %m - Month as a number (01 to 12)
    # %M - Minute (00 to 59)
    # %p - AM/PM designation
    # %S - Second (00 to 59)
    # %y - Year without century (00 to 99)
    # %Y - Year with century (e.g., 2023)

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
