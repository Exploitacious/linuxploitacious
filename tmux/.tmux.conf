# --- Terminal capabilities ---
set-option -sa terminal-overrides ",xterm*:Tc"

# --- Prefix ---
# Use C-a (screen-default); avoids the Windows IME Ctrl+Space clash on Termius/PuTTY/etc.
unbind C-b
unbind C-Space
set -g prefix C-a
bind C-a send-prefix

# --- Indexing ---
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# --- Mouse & history ---
set -g mouse on
set -g history-limit 50000

# --- Vi keys in copy mode ---
setw -g mode-keys vi

# --- Quality of life keybinds ---
# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# Open splits in current pane's working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

# --- Plugins (managed by TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# resurrect: also save+restore pane contents and running programs.
# NEVER add claude here — Claude Code sessions are owned by the COWORK
# remote-sessions registry (@reboot start-remote-claude.sh), which resumes the
# real transcript with --remote-control. A resurrect respawn types bare
# `claude` into the pane -> fresh context-less impostor wearing the old
# session's name (2026-07-15 incident).
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 htop btop watch tail "node->node" "opencode->opencode"'
# continuum: auto-save every 15min. Auto-restore must stay OFF — it races the
# @reboot registry boot script and resurrects deliberately archived sessions
# whenever the tmux server restarts (e.g. tmux-main.service Restart storm).
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'

# Clipboard integration (OSC52 → Termius → Windows clipboard)
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'clipboard'
set-option -g set-clipboard on

# Visual feedback when prefix pressed (helpful while learning)
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt 'PFX'
set -g @prefix_highlight_copy_prompt   'COPY'
set -g @prefix_highlight_sync_prompt   'SYNC'
set -g @prefix_highlight_empty_prompt  ''
set -g @prefix_highlight_empty_has_affixes 'off'

# Status-bar widgets
set -g @plugin 'tmux-plugins/tmux-cpu'

# --- Status bar refresh ---
set -g status-interval 5
set -g status-right-length 240
set -g status-left-length 40

# Catppuccin shows session + window dir on right; keep those, turn off user/host/date_time
# so we can place our own widgets to the right of them.
set -g @catppuccin_date_time 'off'
set -g @catppuccin_user 'off'
set -g @catppuccin_host 'off'

# --- Auto-install TPM on first run ---
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# TPM runs plugins synchronously. Catppuccin sets status-right during this pass,
# so we APPEND our widgets afterward via `set -ga` to preserve its session/window display.
run '~/.tmux/plugins/tpm/tpm'

# Append our widgets as catppuccin-style pills: <icon-block><label-block>, each
# pill = mocha-bg accent for icon + dim panel-bg for value. Matches the visual
# structure of catppuccin's session/window chunks so the bar reads as continuous.
# Direct #(...) script calls — see comment above re. plugin placeholder timing.
set -ga status-right '#{?client_prefix,#[fg=#1e1e2e#,bg=#fab387] PFX #[fg=#cdd6f4#,bg=#313244] active ,}#[fg=#1e1e2e,bg=#89b4fa] CPU #[fg=#cdd6f4,bg=#313244] #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[fg=#1e1e2e,bg=#94e2d5] RAM #[fg=#cdd6f4,bg=#313244] #(~/.tmux/plugins/tmux-cpu/scripts/ram_percentage.sh) #(~/.local/bin/netstatus)#[fg=#cdd6f4,bg=#313244] #(~/.local/bin/netdot) %Y-%m-%d %H:%M '
